[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carpi"
version = "0.0.1"
description = "Open-source vehicle diagnostics and coding hub for Raspberry Pi"
readme = "README.md"
# 3.11 is what Raspberry Pi OS Bookworm ships. Do not raise this without a
# matching plan for the target image, even if your dev machine has something newer.
#
# Deliberately open-ended, and deliberately wider than what CI validates. 3.11 is the
# only version tested, and the classifiers below say so; newer ones are permitted because
# refusing to install on a contributor's 3.13 laptop would cost more than the untested
# versions do. A break on a newer version is a bug report, not something to pre-empt.
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "car-pi contributors" }]
keywords = ["obd2", "obdii", "can", "canbus", "uds", "automotive", "diagnostics", "raspberry-pi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  # Only 3.11 is listed because only 3.11 is tested. Listing versions CI does not run
  # would be claiming coverage that does not exist.
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "python-can>=4.3",
  # PyPI name is can-isotp, import name is `isotp`. Provides both a portable
  # userspace ISO-TP stack (works on macOS) and Linux kernel-socket bindings.
  "can-isotp>=2.0",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "click>=8.1",
  # The portable unit serves its own UI over its own hotspot, so the server is part
  # of the product rather than an optional extra.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # Plain `uvicorn` has no WebSocket implementation; live values need one. Chosen
  # over uvicorn[standard] to avoid pulling compiled uvloop/httptools onto a Pi.
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/buede/car-pi"

[project.scripts]
carpi = "carpi.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"carpi.defs" = [
  "schema/*.json",
  "generic/*.yaml",
  "generic/rules/*.yaml",
  "vehicles/*.md",
  "vehicles/*/*.yaml",
]
# The PWA ships inside the package so the appliance has no separate build or deploy
# step. A missing entry here yields a server that starts and serves nothing.
"carpi.server" = [
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.svg",
  "static/*.webmanifest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# SocketCAN tests need a vcan interface, so they are excluded from the default run
# and opted into with `pytest -m socketcan`.
addopts = "-q -m 'not socketcan'"
markers = [
  "socketcan: requires a SocketCAN interface named by CARPI_TEST_SOCKETCAN",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
