name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is what Raspberry Pi OS Bookworm ships, so it is the version that
          # actually matters. The others catch anything that will break on upgrade.
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.11" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      # The deployment scripts are shell, run as root on a Pi, and are the least
      # exercised code here -- exactly where a quoting mistake hides.
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck deploy/*.sh dev

      # There is no browser in CI, so the UI's JavaScript is at least parsed. Combined
      # with the API-contract tests in tests/test_server.py this covers the two ways the
      # phone UI can break without any Python test noticing.
      - name: Parse the UI JavaScript
        run: |
          for file in src/carpi/server/static/*.js; do
            node --check "$file"
          done

      - name: Validate the definition database
        run: carpi defs check

      - name: Test
        run: pytest -q

      # Proves the packaged tool works end to end from a clean install, and that the
      # definition files are actually included in the distribution -- a packaging
      # mistake there would pass every unit test and fail on a real Pi.
      - name: Smoke-test every scenario through the CLI
        run: |
          for scenario in $(carpi scenarios | grep -E '^[a-z]' ); do
            echo "--- $scenario"
            carpi demo --scenario "$scenario" --format json > "/tmp/$scenario.json"
            python -c "
          import json, sys
          document = json.load(open('/tmp/$scenario.json'))
          assert document['schema'] == 'carpi.inspection/1'
          assert document['ecus'], 'no ECU answered'
          print(' ', len(document['findings']), 'findings')
          "
          done

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Developers run the suite through ./dev, so a broken Dockerfile breaks everyone's
      # workflow while every native job stays green. Built here so that cannot happen
      # quietly. The runtime target is built too, because it installs the package
      # non-editable and so is the only thing that proves packaging works from scratch.
      - name: Build the dev image
        run: docker build --target dev -t carpi-dev:ci .

      - name: Run the suite inside the container
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            carpi-dev:ci pytest -q

      - name: Build the runtime image and check it starts
        run: |
          docker build --target runtime -t carpi-runtime:ci .
          docker run --rm carpi-runtime:ci carpi defs check
          docker run --rm carpi-runtime:ci carpi demo --scenario healthy --format json \
            | python -c "import json,sys; assert json.load(sys.stdin)['ecus']; print('runtime image OK')"

  socketcan:
    name: SocketCAN (vcan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The virtual-bus tests cover the protocol logic, but a real vehicle is reached
      # over SocketCAN with kernel ISO-TP. vcan exercises that path for real, so a
      # regression in it is caught here rather than in a car park.
      - name: Set up a virtual CAN interface
        run: |
          set -euo pipefail
          # The Azure-tuned kernel on GitHub's runners does not carry vcan in the base
          # image; it lives in the linux-modules-extra package for the running kernel.
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -yqq "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test over SocketCAN
        env:
          CARPI_TEST_SOCKETCAN: vcan0
        run: |
          set -euo pipefail
          pytest -m socketcan --no-header | tee /tmp/socketcan.log
          # A skipped test is not a passing test. These tests skip themselves when no
          # interface is available, and pytest exits 0 on skips, so without this guard
          # the job would go green if vcan ever stopped loading -- reporting that the
          # real-vehicle transport is covered when nothing had run at all.
          #
          # Asserted against the summary line rather than per-test PASSED markers,
          # because addopts in pyproject.toml carries -q and would cancel out a -v here.
          if ! grep -qE '[1-9][0-9]* passed' /tmp/socketcan.log; then
            echo "::error::No SocketCAN test passed; the interface was not usable"
            exit 1
          fi
          if grep -qE '[1-9][0-9]* skipped' /tmp/socketcan.log; then
            echo "::error::SocketCAN tests were skipped; the interface was not usable"
            exit 1
          fi
